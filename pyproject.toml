[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneprep"
version = "0.2.0"
description = "Codon-optimised gene sequence preparation for E. coli expression and GenScript ordering"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Tom Emrich-Mills"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.80",
    "openpyxl>=3.1.0",
    "seqfold>=0.7.17",
]

[project.scripts]
geneprep = "geneprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
